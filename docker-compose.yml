# Local development.
#   docker compose up --build                       -> api (Postgres-backed queue) + web
#   docker compose --profile celery up --build      -> also Redis + a Celery worker
#                                                      (set QUEUE_BACKEND=celery in .env)
# The database and auth are your Supabase project (see .env.example).

services:
  api:
    build:
      context: ./backend
      args:
        WITH_CELERY: "true"
    env_file: .env
    ports:
      - "8000:8000"

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - api

  redis:
    image: redis:7-alpine
    profiles: ["celery"]

  worker:
    build:
      context: ./backend
      args:
        WITH_CELERY: "true"
    profiles: ["celery"]
    env_file: .env
    environment:
      QUEUE_BACKEND: celery
      REDIS_URL: redis://redis:6379/0
    command: celery -A app.queue.celery_queue.celery_app worker -l info
    depends_on:
      - redis
