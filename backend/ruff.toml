line-length = 100
target-version = "py310"
# eval/ holds one-off data-generation and analysis scripts (not application code, not
# imported by the app, not unit-tested) — formatting them like the reviewed app is overkill.
exclude = ["eval"]
[lint]
select = ["E", "F", "I", "B"]
ignore = ["B008"]  # FastAPI's Depends()/File() defaults are the framework idiom
